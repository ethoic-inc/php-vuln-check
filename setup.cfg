[metadata]
name = php-vuln-check
version = 0.1.1
description = PHP vulnerability checker for PHP2Shell (CVE-2026-109618, CVE-2026-109619): audits servers, Docker images and CI. Backport-aware, zero dependencies.
long_description = file: README.md
long_description_content_type = text/markdown
author = Ethoic Inc
author_email = hello@ethoic.com
license = MIT
url = https://github.com/ethoic-inc/php-vuln-check
project_urls =
    Homepage = https://ethoic-inc.github.io/php-vuln-check/
    Source = https://github.com/ethoic-inc/php-vuln-check
    Issues = https://github.com/ethoic-inc/php-vuln-check/issues
keywords = php, php2shell, cve-2026-109618, cve-2026-109619, vulnerability-scanner, security, devsecops, docker, sarif, sysadmin, incident-response
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Operating System :: MacOS
    Programming Language :: Python :: 3
    Topic :: Security
    Topic :: System :: Systems Administration

[options]
py_modules = php_vuln_check
python_requires = >=3.6

[options.entry_points]
console_scripts =
    php-vuln-check = php_vuln_check:main
