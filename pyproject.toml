[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "php-vuln-check"
version = "0.1.0"
description = "PHP vulnerability checker for PHP2Shell (CVE-2026-109618, CVE-2026-109619): audits servers, Docker images and CI. Backport-aware, zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.6"
authors = [{ name = "Jake Bowser" }]
keywords = [
  "php", "php2shell", "cve-2026-109618", "cve-2026-109619", "vulnerability-scanner",
  "security", "devsecops", "docker", "sarif", "sysadmin", "incident-response",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://jake-bowser.github.io/php-vuln-check/"
Source = "https://github.com/jake-bowser/php-vuln-check"
Issues = "https://github.com/jake-bowser/php-vuln-check/issues"

[project.scripts]
php-vuln-check = "php_vuln_check:main"

[tool.setuptools]
py-modules = ["php_vuln_check"]
