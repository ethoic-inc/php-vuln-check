name: PHP Vuln Check
description: Fail the build when Dockerfiles, compose files or Kubernetes manifests use a PHP version affected by PHP2Shell (CVE-2026-109618 / CVE-2026-109619).
author: Jake Bowser
branding:
  icon: shield
  color: red

inputs:
  path:
    description: File or folder to scan for PHP image references.
    default: "."
  fail-on:
    description: "Fail the step on `vulnerable` (default), on `review` too, or `never`."
    default: vulnerable
  sarif-file:
    description: "If set, also write a SARIF report here for github/codeql-action/upload-sarif."
    default: ""

runs:
  using: composite
  steps:
    - name: Write SARIF report
      if: inputs.sarif-file != ''
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SARIF: ${{ inputs.sarif-file }}
      run: python3 "$GITHUB_ACTION_PATH/php_vuln_check.py" images "$INPUT_PATH" --format sarif --fail-on never -o "$INPUT_SARIF"
    - name: Check PHP versions
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: python3 "$GITHUB_ACTION_PATH/php_vuln_check.py" images "$INPUT_PATH" --fail-on "$INPUT_FAIL_ON" --no-color
