name: Release

# Pushing a tag like v0.1.0 attaches the single-file download, the wheel, the sdist
# and SHA256SUMS to the GitHub release (creating it if needed).
# Publishing to PyPI is opt-in: set the repository variable PYPI_PUBLISH to "true"
# after registering this repo as a trusted publisher on pypi.org.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tag must match the version in the code and in setup.cfg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CODE=$(python -c "import php_vuln_check as p; print(p.__version__)")
          CFG=$(sed -n 's/^version = //p' setup.cfg)
          echo "tag=$TAG code=$CODE setup.cfg=$CFG"
          [ "$TAG" = "v$CODE" ] && [ "$CODE" = "$CFG" ] || { echo "version mismatch"; exit 1; }
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install build
          python -m build
          cp php_vuln_check.py dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: rm -f dist/php_vuln_check.py dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
