name: Release

# Pushing a tag like v0.1.0 attaches the single-file download, the wheel, the sdist
# and SHA256SUMS to the GitHub release (creating it if needed).
# Publishing to PyPI is opt-in: set the repository variable PYPI_PUBLISH to "true"
# after registering this repo as a trusted publisher on pypi.org.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install build
          python -m build
          cp php_vuln_check.py dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: rm -f dist/php_vuln_check.py dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
