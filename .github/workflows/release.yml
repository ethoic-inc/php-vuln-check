name: Release

# Pushing a tag like v0.1.0 attaches the single-file download, the wheel, the sdist
# and SHA256SUMS to the GitHub release (creating it if needed).
# Run it by hand (workflow_dispatch) for a dry run: it builds, uploads and re-downloads the
# artifacts and checks them, but creates no release.
# Publishing to PyPI is opt-in: set the repository variable PYPI_PUBLISH to "true"
# after registering this repo as a trusted publisher on pypi.org.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag must match the version in the code and in setup.cfg
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CODE=$(python -c "import php_vuln_check as p; print(p.__version__)")
          CFG=$(sed -n 's/^version = //p' setup.cfg)
          echo "tag=$TAG code=$CODE setup.cfg=$CFG"
          [ "$TAG" = "v$CODE" ] && [ "$CODE" = "$CFG" ] || { echo "version mismatch"; exit 1; }
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install build
          python -m build
          cp php_vuln_check.py dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  verify-dist:
    # Dry-run check that the uploaded artifacts download intact and the single file runs.
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify checksums and run the single file
        run: |
          cd dist && ls -l && sha256sum -c SHA256SUMS
          python3 php_vuln_check.py --version
          python3 php_vuln_check.py images --image php:8.5.12 --no-color

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: rm -f dist/php_vuln_check.py dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
