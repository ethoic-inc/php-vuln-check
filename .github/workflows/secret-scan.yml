# Fails the build if a credential (API key, token, private key, database password) is committed.
# Scans every commit on every branch with gitleaks, a pinned and checksum-verified release.
# A false positive is allowed by name in .gitleaks.toml at the repo root, never by turning this off.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          case "$(uname -m)" in
            x86_64) arch=x64; sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64 | arm64) arch=arm64; sum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "no gitleaks build for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_${arch}.tar.gz"
          echo "${sum}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all history
        # --redact keeps any value it finds out of this log.
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="--all" .'
